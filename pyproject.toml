[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CausalTrace"
version = "0.1.0"
description = "Investigate software regressions using Git history and JUnit reports"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
causaltrace = "causaltrace.__main__:main"

[tool.setuptools]
packages = ["causaltrace"]
